# ==============================================================================
# leaf 設定 (https://leaf.rivolink.mg/)
# ------------------------------------------------------------------------------
# leaf は設定なしでも動作するターミナル Markdown ビューアなので、ここには
# 既定値から変更したい項目のみを記述する（未記載のキーは既定値が使われる）。
# 既定値付きのフルテンプレートは `leaf --config` で生成・確認できる。
# ==============================================================================

# Ctrl+E で開く外部エディタ。dotfiles では EDITOR=fresh に統一しているため
# leaf からも Fresh を使う。{$path} / {$line} は leaf が展開するプレースホルダで、
# 表示中の先頭行に対応する位置で開く（Fresh の `<file>:<line>` 形式）。
# 優先順位: --editor フラグ > LEAF_EDITOR > この設定 > nano
editor = "fresh {$path}:{$line}"
